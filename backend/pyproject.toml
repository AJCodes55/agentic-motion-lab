[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mobility-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2.6,<3", "pandas>=3,<4", "python-multipart>=0.0.32,<1", "httpx>=0.28,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=6,<8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=mobility --cov-report=term-missing --cov-fail-under=80"
